<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The bare lit eye. Not the flat AI Sight favicon eye - different marks,
         different things. See Assets/brand/sightofanshul/BRAND-BRIEF.md §10. -->
    <link rel="icon" href="/brand/soa-eye-128.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/soa-symbol-256.png" />

    <!-- Fonts were @imported from inside index.css, which serialises them:
         the browser had to download the CSS before it even discovered the
         font requests. Preconnecting and requesting them here overlaps both. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@700,600,500,400&f[]=satoshi@700,500,400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <title>Anshul Rastogi - Sight of Anshul</title>
    <meta
      name="description"
      content="Anshul Rastogi, 20, Delhi. I build AI systems and then show people exactly how they work. Founder of Socioverse and Up N Running, co-founder of BunkToBrains. The AI Sight course is free on YouTube."
    />
    <meta name="author" content="Anshul Rastogi" />
    <meta name="theme-color" content="#F5B642" />

    <meta property="og:site_name" content="Sight of Anshul" />
    <meta property="og:title" content="Anshul Rastogi - Sight of Anshul" />
    <meta
      property="og:description"
      content="I build AI systems, and then show people exactly how they work. Perspective is everything."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sightofanshul.com" />
    <meta property="og:image" content="/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AnshulR20" />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- sightofanshul.com is canonical. anshulrastogi.com and .xyz 301 to it -
         see vercel.json. Every other channel already says "sightofanshul". -->
    <link rel="canonical" href="https://sightofanshul.com" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
